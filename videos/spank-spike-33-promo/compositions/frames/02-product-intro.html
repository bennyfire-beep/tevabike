  <script src="vendor/gsap.min.js"></script>
  <script>
    (function () {
      var VIEWPORT_WIDTH = 1080;
      var VIEWPORT_HEIGHT = 1920;
      var OPEN_SCALE = 5; // extreme close-up on the grip texture at t=0

      var rootEl = document.getElementById("root");
      var worldEl = document.getElementById("pi2-world");
      var anchorEl = document.getElementById("pi2-anchor");
      var scrimEl = document.getElementById("pi2-scrim");
      var titleEl = document.getElementById("pi2-title");
      var subtitleEl = document.getElementById("pi2-subtitle");
      var heroCardEl = document.getElementById("pi2-hero-card");

      // measure the real laid-out anchor center — never hand-derived
      var rootRect = rootEl.getBoundingClientRect();
      var aRect = anchorEl.getBoundingClientRect();
      var anchorX = aRect.left + aRect.width / 2 - rootRect.left;
      var anchorY = aRect.top + aRect.height / 2 - rootRect.top;
      var offsetX = anchorX - VIEWPORT_WIDTH / 2;
      var offsetY = anchorY - VIEWPORT_HEIGHT / 2;

      // single source of truth for the camera; single-wrapper form: T = -offset * S
      var cam = {
        scale: OPEN_SCALE,
        x: -offsetX * OPEN_SCALE,
        y: -offsetY * OPEN_SCALE,
      };
      function applyCamera() {
        worldEl.style.transform =
          "translate(" + cam.x + "px, " + cam.y + "px) scale(" + cam.scale + ")";
      }
      applyCamera(); // seed frame 0 — punched-in on the grip texture

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // Scene 1→2: ONE continuous decelerating zoom-out, running from t=0,
      // completing as Scene 3 locks. No zoom-in anywhere; camera static after.
      tl.to(
        cam,
        {
          scale: 1,
          x: 0,
          y: 0,
          duration: 3.2,
          ease: "expo.out",
          onUpdate: applyCamera,
        },
        0
      );

      // Scene 2: cue "ספייק 33" flash-arrives over a soft ink-black scrim,
      // an overlay on the still-moving world, not part of the zoom.
      tl.fromTo(scrimEl, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 1.05);
      tl.fromTo(
        titleEl,
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.22, ease: "power2.out" },
        1.2
      );

      // Scene 3: camera has locked — hero.webp settles in via a soft power3
      // slide-crossfade, "מבית SPANK" lands beneath as a supporting label.
      tl.fromTo(
        heroCardEl,
        { opacity: 0, x: 50 },
        { opacity: 1, x: 0, duration: 0.7, ease: "power3.out" },
        3.2
      );
      tl.fromTo(
        subtitleEl,
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        3.35
      );

      // the video's one deliberate held beat — a brief settle, subtle jitter
      // only, then dead static to the end (no drift/breathing).
      tl.to(cam, { x: 3, y: -2, duration: 0.14, ease: "power1.inOut", onUpdate: applyCamera }, 3.9);
      tl.to(cam, { x: -2, y: 2, duration: 0.14, ease: "power1.inOut", onUpdate: applyCamera }, 4.04);
      tl.to(cam, { x: 0, y: 0, duration: 0.18, ease: "power1.inOut", onUpdate: applyCamera }, 4.18);

      window.__timelines["02-product-intro"] = tl;
    })();
